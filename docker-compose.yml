services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  whatsapp-bridge:
    build:
      context: ./services/whatsapp-bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${WHATSAPP_BRIDGE_PORT:-8080}
      DATA_DIR: /data
    volumes:
      - whatsapp_data:/data
    expose:
      - "${WHATSAPP_BRIDGE_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:$${PORT}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN}}
      API_BASE_URL: ${API_BASE_URL:-https://${DOMAIN}/api}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      THREADS_APP_ID: ${THREADS_APP_ID:-}
      THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}
      THREADS_ACCESS_TOKEN: ${THREADS_ACCESS_TOKEN:-}
      THREADS_USER_ID: ${THREADS_USER_ID:-}
      THREADS_VERIFY_TOKEN: ${THREADS_VERIFY_TOKEN:?Set THREADS_VERIFY_TOKEN in .env}
      THREADS_API_BASE_URL: ${THREADS_API_BASE_URL:-https://graph.threads.net}
      THREADS_POLL_INTERVAL_MINUTES: ${THREADS_POLL_INTERVAL_MINUTES:-10}
      THREADS_DAILY_CALL_LIMIT: ${THREADS_DAILY_CALL_LIMIT:-2200}
      THREADS_TOKEN_REFRESH_INTERVAL_DAYS: ${THREADS_TOKEN_REFRESH_INTERVAL_DAYS:-7}
      WHATSAPP_BRIDGE_URL: http://whatsapp-bridge:${WHATSAPP_BRIDGE_PORT:-8080}
      WHATSAPP_RECIPIENTS: ${WHATSAPP_RECIPIENTS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_RECIPIENTS: ${EMAIL_RECIPIENTS:-}
    depends_on:
      db:
        condition: service_healthy
      whatsapp-bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    expose:
      - "8000"
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - internal

volumes:
  postgres_data:
  whatsapp_data:
  caddy_data:
  caddy_config:

networks:
  internal:
